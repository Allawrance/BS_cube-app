  const scaled = maxScore > 0 ? Math.round((score / maxScore) * 20) : 0;
  return BAND_MAP.find(([lo,hi])=>scaled>=lo&&scaled<=hi)?.[2] || "Band 2";

════════════════════════════════════════
CUBE ANNOTATION RULES — BUSINESS STUDIES
════════════════════════════════════════

C — CIRCLE (directive verbs)
- Detect ALL directive verbs in the question. Many questions have TWO (e.g. "Identify... and explain...").
- Circle ONLY the verb word(s) themselves — not surrounding words.
- If there are two directives, return BOTH in the directives array.
- For each directive, record its exact startIndex in the question string.

U — UNDERLINE (syllabus keywords ONLY)
- Underline ONLY the specific noun keyword(s) from the matching Business Studies syllabus dot point.
- Do NOT underline whole clauses, phrases, or sentences.
- Match against the syllabus database keywords list for the relevant topic.
- Example: question mentions "outsourcing" → underline "outsourcing" and annotate with topic 10.1.4 or 10.4.1
- Example: question mentions "gearing" → underline "gearing" and annotate with 10.3.2
- If there are multiple syllabus keywords, return one underline annotation per keyword.

⚠️ ANNOTATION PRIORITY RULE — ONE ANNOTATION PER WORD:
Priority order (highest wins):
  1. C — CIRCLE: directive verbs always take priority
  2. U — UNDERLINE: syllabus keywords (if not already circled)
  3. B — BOX: constraints/scope words (if not already circled or underlined)

B — BOX (constraints — box anything that limits scope)
- Box ALL of the following:
  1. Evidence/method constraints: "using a case study", "with reference to", "using the stimulus", "using financial data"
  2. Scope constraints: number words ("two strategies", "one stakeholder"), specific business functions named
  3. Causal/directional constraint words: "impact", "effect", "change", "increase", "decrease", "cause", "result"
  4. Named businesses, markets, functions or time periods that constrain the topic
- NEVER box single prepositions or articles (to, on, the, a, an, of, in, at, by, for).

E — EVIDENCE ARROWS (planning tab only)
- For each boxed constraint and each directive, generate a planning arrow.
- targetWord = the exact word from the question being annotated
- label = a SPECIFIC, CONTENT-RICH business answer note — NOT a generic instruction.
  - For IDENTIFY: write the ACTUAL business term (e.g. "enterprise agreements" not "name the strategy")
  - For EXPLAIN: write the ACTUAL mechanism (e.g. "lower costs→higher profit margin" not "cause + effect")
  - For causal/directional constraint (e.g. "impact"): write WHAT that impact is (e.g. "reduces labour costs")
  - For scope constraints: write the specific content required
  - Labels may be up to 6 words — be specific and business-focused
- targetStartIndex = character position of that word in the question string

════════════════════════════════════════
MULTI-DIRECTIVE QUESTIONS
════════════════════════════════════════
If the question contains two directive verbs (e.g. "Identify and explain"):
- Return ALL directives in the directives array.
- The primary directive determines rubric scoring and modality rules.
- writingScaffold must address BOTH directives in sequence.

════════════════════════════════════════
RUBRIC SCORING (0–5 each)
════════════════════════════════════════

TIER 1 — RECALL/IDENTIFICATION (identify, define, list, name, state):
- NO causal connectives required
- causalConnectives: applicable=false, score=0
- modality: applicable=false
- Total out of 10 (complexNounGroups + logicalFlow only)
- specialCheck.type = "none"

TIER 2 — DESCRIPTION (describe, outline, compare, contrast, calculate):
- No causal connectives required
- causalConnectives: applicable=false, score=0
- modality: applicable=false
- Total out of 10
- specialCheck.type = "none"

TIER 3 — REASONING (explain, analyse, discuss, recommend):
- Causal connectives ARE required
- For EXPLAIN: specialCheck.type = "explain"
- Modality: ignore for explain/recommend; optional for analyse/discuss

TIER 4 — EVALUATIVE (assess, evaluate, justify):
- Causal connectives required AND judgement required
- specialCheck.type = "assess_eval"
- Modality: REQUIRED

Causal Connectives: 0=none, 1=present but wrong/weak, 2=one correct, 3=two correct, 4=three+, 5=four+ varied
Complex Noun Groups: 0=none, 1=minimal, 2=one clear business noun group, 3=two+, 4=several precise, 5=consistent technical business language
Modality: IGNORE if Tier 1/2; optional for analyse/discuss; REQUIRED for assess/evaluate/justify
Logical Flow: 0=no structure, 1=disconnected, 2=basic, 3=mostly logical, 4=clear org, 5=highly coherent concept→mechanism→outcome

SPECIAL DIRECTIVE RULES — BUSINESS STUDIES:
- EXPLAIN: must use SO, BECAUSE, or BUT (or accepted alternatives) + state business outcome
- EVALUATE/ASSESS: must include PRO argument, CON/limitation, AND IS/IS NOT judgement linked to business performance
- JUSTIFY: must name the strategy and link to specific business outcome
- RECOMMEND: must name the strategy and explain WHY it suits THIS business

BAND MAPPING (only when marks not given): 0-5=Band2, 6-9=Band3, 10-13=Band4, 14-17=Band5, 18-20=Band6

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const toB64 = f => new Promise((res, rej) => {
  const img = new Image();
  const objectUrl = URL.createObjectURL(f);
  img.onload = () => {
    URL.revokeObjectURL(objectUrl);
    const MAX_W = 1200;
    const scale = img.width > MAX_W ? MAX_W / img.width : 1;
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    res(canvas.toDataURL('image/jpeg', 0.82).split(',')[1]);
  };
  img.onerror = rej;
  img.src = objectUrl;
});

const sanitiseInput = (str) => String(str || '').replace(/[`${}\\]/g, '').trim().slice(0, 200);

// Privacy: convert "Alan Lawrance" → "Alan L" for Google Sheets logging
const privacyName = (fullName) => {
  const parts = fullName.trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "anonymous";
  if (parts.length === 1) return parts[0];
  return parts[0] + " " + parts[parts.length - 1][0].toUpperCase();
};

// ─── SVG CONSTANTS ────────────────────────────────────────────────────────────
const FONT_SIZE = 17;
const CW  = 10.2;
const LH  = 38;
const PL  = 44;
const PT  = 58;
const CPL = 50;

function buildLines(text, cplOverride) {
  const CPL_USE = cplOverride || CPL;
  if (!text) return [];
  const lines = [];
  const words = text.split(/(\s+)/);
  let lineText = "", lineStart = 0, charPos = 0;
  words.forEach(token => {
    if (!token) { charPos += token.length; return; }
    if (/^\s+$/.test(token)) {
      if (lineText.length + token.length > CPL_USE) {
        if (lineText) lines.push({ text: lineText, start: lineStart });
        lineStart = charPos + token.length; lineText = "";
      } else { lineText += token; }
    } else {
      if (lineText.length + token.length > CPL_USE && lineText.trim()) {
        lines.push({ text: lineText, start: lineStart });
        lineStart = charPos; lineText = token;
      } else {
        if (!lineText) lineStart = charPos;
        lineText += token;
      }
    }
    charPos += token.length;
  });
  if (lineText.trim()) lines.push({ text: lineText, start: lineStart });
  return lines;
}

function getXY(idx, lines, yOff = 0) {
  if (!lines.length) return { x: PL, y: PT + yOff, li: 0 };
  for (let i = 0; i < lines.length; i++) {
    const end = lines[i].start + lines[i].text.length;
    if (idx < end || i === lines.length - 1) {
      const col = Math.max(0, idx - lines[i].start);
      return { x: PL + Math.round(col * CW * 2) / 2, y: PT + yOff + i * LH, li: i };
    }
  }
  return { x: PL, y: PT + yOff, li: 0 };
}

function SVGAnnotatedPaper({ text, directives, syllabusKeywords, constraints, planningArrows, mode }) {
  if (!text) return null;
  const dirs = directives?.length ? directives : [];
  const kwds = syllabusKeywords?.length ? syllabusKeywords : [];
  const isMobile = typeof window !== "undefined" && window.innerWidth < 500;
  const effectiveCPL = isMobile ? 28 : CPL;
  const lines = buildLines(text, effectiveCPL);
  const nLines = Math.max(lines.length, 1);
  const W = PL + effectiveCPL * CW + PL;

  // ── Dynamic PLAN_EXTRA: calculate only the space actually needed above line 0 ──
  // Pass 1: use PLAN_EXTRA=0 to find which arrows sit above line 0 and how much
  // space their pills require. Then set PLAN_EXTRA = that amount + 20px breathing room.
  const PILL_H = 26; const PILL_MARGIN = 10; const TOP_PAD = 20;
  let PLAN_EXTRA = 0;
  if (mode === "plan" && planningArrows?.length) {
    const nArrows = planningArrows.length;
    let maxAboveNeed = 0;
    planningArrows.forEach((arrow, ai) => {
      let above;
      if (nArrows <= 1) above = true;
      else if (nArrows === 2) above = (ai === 0);
      else if (nArrows === 3) above = (ai !== 1);
      else above = (ai % 2 === 0);
      if (!above) return;
      // Find target line using PLAN_EXTRA=0 pass
      const si0 = (() => {
        const w = arrow.targetWord; const h = arrow.targetStartIndex ?? 0;
        if (!w) return h;
        const wl = w.toLowerCase(); const ql = text.toLowerCase();
        for (let d = 0; d <= 25; d++) { const i = h+d; if (ql.slice(i,i+wl.length)===wl) return i; }
        for (let d = 1; d <= 10; d++) { const i = h-d; if (i>=0&&ql.slice(i,i+wl.length)===wl) return i; }
        return h;
      })();
      const s0 = getXY(si0, lines, 0);
      const targetLine = s0.li;
      // Space needed: from top of SVG (y=0) to top of pill above this line
      // stemToY (with PLAN_EXTRA=0) = PT + targetLine*LH - FONT_SIZE*0.9 - 4
      const stemToY0 = PT + targetLine * LH - FONT_SIZE * 0.9 - 4;
      const pillTop0 = stemToY0 - PILL_H - PILL_MARGIN;
      // We need pillTop to be >= TOP_PAD, so PLAN_EXTRA >= TOP_PAD - pillTop0
      const needed = TOP_PAD - pillTop0;
      if (needed > maxAboveNeed) maxAboveNeed = needed;
    });
    PLAN_EXTRA = Math.max(0, Math.ceil(maxAboveNeed));
  }

  const H = PT + PLAN_EXTRA + nLines * LH + 30;
  const shapes = [];

  const findExact = (word, hintIdx) => {
    if (!word || hintIdx == null) return hintIdx;
    const wl = word.toLowerCase(); const ql = text.toLowerCase();
    for (let d = 0; d <= 25; d++) { const i = hintIdx + d; if (ql.slice(i, i + wl.length) === wl) return i; }
    for (let d = 1; d <= 10; d++) { const i = hintIdx - d; if (i >= 0 && ql.slice(i, i + wl.length) === wl) return i; }
    return hintIdx;
  };

  // C: red ovals — directive verbs
  dirs.forEach((dv, di) => {
    const si = findExact(dv.word, dv.startIndex ?? 0);
    const s = getXY(si, lines, PLAN_EXTRA);
    const wPx = dv.word.length * CW;
    const cy = s.y - FONT_SIZE * 0.36;
    const ry = FONT_SIZE * 0.80;
    const rx = wPx / 2 + 10;
    const cx = s.x + wPx / 2;
    shapes.push(<ellipse key={`c${di}`} cx={cx} cy={cy} rx={rx} ry={ry} fill="none" stroke="#c0392b" strokeWidth="2.5" opacity="0.9"/>);
  });

  // U: blue underlines — syllabus keywords
  const usedRanges = [];
  kwds.forEach((kw, ki) => {
    const word = kw.word || "";
    const si = findExact(word, kw.startIndex ?? 0);
    const ei = si + word.length;
    const overlap = usedRanges.some(([a,b]) => si < b && ei > a);
    if (overlap) return;
    usedRanges.push([si, ei]);
    const s = getXY(si, lines, PLAN_EXTRA);
    const e = getXY(ei, lines, PLAN_EXTRA);
    const yBase = s.y + 4;
    shapes.push(<line key={`u${ki}`} x1={s.x} y1={yBase} x2={Math.max(s.x + word.length * CW - 4, s.x + 4)} y2={yBase} stroke="#1565c0" strokeWidth="2.5" opacity="0.85"/>);
  });

  // B: green boxes — constraints
  // Use start+end character positions so multi-word phrases (e.g. "business performance")
  // get the correct pixel width regardless of word wrap.
  constraints?.forEach((ct, ci) => {
    const si = findExact(ct.text, ct.startIndex ?? 0);
    const ei = si + ct.text.length;
    const s = getXY(si, lines, PLAN_EXTRA);
    const e = getXY(ei, lines, PLAN_EXTRA);
    // If phrase wraps across lines, draw on the start line using full phrase px width
    const wPx = s.li === e.li
      ? (e.x - s.x)                    // same line — use actual pixel span
      : ct.text.length * CW;            // wrapped — fall back to char count
    const boxTop = s.y - FONT_SIZE * 0.85;
    const boxH   = FONT_SIZE * 1.15;
    shapes.push(<rect key={`b${ci}`} x={s.x - 3} y={boxTop} width={Math.max(wPx + 6, 20)} height={boxH} fill="none" stroke="#2e7d32" strokeWidth="2" rx="3" opacity="0.85"/>);
  });

  // E: planning arrows (plan mode only)
  const notes = [];
  if (mode === "plan" && planningArrows?.length) {
    const nArrows = planningArrows.length;
    planningArrows.forEach((arrow, ai) => {
      const si = findExact(arrow.targetWord, arrow.targetStartIndex ?? 0);
      const s = getXY(si, lines, PLAN_EXTRA);
      const targetLine = s.li;

      // Alternate above/below to avoid overlap
      let above;
      if (nArrows <= 1) above = true;
      else if (nArrows === 2) above = (ai === 0);
      else if (nArrows === 3) above = (ai !== 1);
      else above = (ai % 2 === 0);

      const stemToY = above
        ? PT + PLAN_EXTRA + targetLine * LH - FONT_SIZE * 0.9 - 4
        : PT + PLAN_EXTRA + targetLine * LH + FONT_SIZE * 0.25 + 4;
      const tipY   = stemToY;
      const arrowX = s.x + (arrow.targetWord?.length || 4) * CW / 2;

      const PILL_H      = 26;
      const PILL_MARGIN = 10;
      const pillY = above ? stemToY - PILL_H - PILL_MARGIN : stemToY + PILL_MARGIN;
      const label = arrow.label || "";
      const pillW = Math.max(label.length * 7.5 + 20, 60);
      // Fix: compute pillX without self-reference
      const pillXRaw = arrowX - pillW / 2;
      const pillX    = Math.max(PL, Math.min(pillXRaw, W - PL - pillW));

      notes.push(
        <g key={`arrow${ai}`}>
          <rect x={pillX} y={pillY} width={pillW} height={PILL_H} rx="13" fill="#c9a84c" opacity="0.92"/>
          <text x={pillX + pillW/2} y={pillY + 17} textAnchor="middle" fontSize="11" fontFamily="sans-serif" fontWeight="700" fill="#040d18">{label}</text>
          <line x1={arrowX} y1={above ? stemToY - 8 : stemToY + 8} x2={arrowX} y2={above ? tipY - 1 : tipY + 1} stroke="#c9a84c" strokeWidth="1.5"/>
          {above
            ? <polygon points={`${arrowX-5},${tipY} ${arrowX+5},${tipY} ${arrowX},${tipY+8}`} fill="#c9a84c"/>
            : <polygon points={`${arrowX-5},${tipY} ${arrowX+5},${tipY} ${arrowX},${tipY-8}`} fill="#c9a84c"/>
          }
        </g>
      );
    });
  }

  return (
    <div style={{overflowX:"auto",marginBottom:"16px"}}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{maxWidth:`${W}px`,display:"block",borderRadius:"12px",boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>
        <rect width={W} height={H} fill="#fffef5" rx="12"/>
        {[...Array(8)].map((_,i)=><line key={i} x1={PL-10} y1={PT+PLAN_EXTRA+i*LH+22} x2={W-20} y2={PT+PLAN_EXTRA+i*LH+22} stroke="rgba(160,180,220,0.3)" strokeWidth="1"/>)}
        <line x1="32" y1="0" x2="32" y2={H} stroke="rgba(255,100,100,0.2)" strokeWidth="1.5"/>
        {lines.map((ln,i)=>(
          <text key={i} x={PL} y={PT+PLAN_EXTRA+i*LH} fontSize={FONT_SIZE} fontFamily="'Courier New',Courier,monospace" fill="#1a1a2e" textLength={ln.text.length*CW} lengthAdjust="spacing">{ln.text}</text>
        ))}
        {shapes}
        {notes}
      </svg>
    </div>
  );
}

// ─── FORMATTED RESPONSE ───────────────────────────────────────────────────────
function normaliseIllegible(text) {
  if (!text) return text;
  return text.replace(/ {3,}/g, ' [?] ');
}

function enrichFormattedResponse(formatted, studentText, nounGroups, connectives) {
  const hasMarkup = t => t && (t.includes('**') || t.includes('_') || t.includes('[?]'));
  let text = hasMarkup(formatted) ? formatted : hasMarkup(studentText) ? studentText : formatted || studentText || '';
  text = normaliseIllegible(text);
  const allConnectives = [...(connectives?.preferred||["so","because","but"]), ...(connectives?.accepted||["therefore","thus","hence","however","although","consequently","as a result","which means","resulting in","leading to","due to","since","yet"])];
  allConnectives.forEach(conn => {
    const escaped = conn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    text = text.replace(new RegExp(`(?<!\\*)(\\b${escaped}\\b)(?!\\*)`, 'gi'), '**$1**');
  });
  if (nounGroups && nounGroups.length > 0 && !text.includes('_')) {
    [...nounGroups].sort((a,b) => b.length - a.length).forEach(ng => {
      if (!ng || ng.length < 2) return;
      const escaped = ng.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      text = text.replace(new RegExp(`(?<![_*])(${escaped})(?![_*])`, 'gi'), '_$1_');
    });
  }
  return text;
}

function FormattedResponse({ text }) {
  if (!text) return null;
  const cleaned = normaliseIllegible(text);
  const parts = [];
  const regex = /\*\*([^*]+)\*\*|_([^_]+)_|\[\?\]/g;
  let last = 0, m;
  while ((m = regex.exec(cleaned)) !== null) {
    if (m.index > last) parts.push(<span key={last}>{cleaned.slice(last, m.index)}</span>);
    if (m[0] === '[?]') {
      parts.push(<span key={m.index} style={{background:"#ff6d00",color:"white",borderRadius:"4px",padding:"1px 6px",fontWeight:900,fontFamily:"sans-serif",fontSize:"11px",margin:"0 2px",verticalAlign:"middle"}}>?</span>);
    } else if (m[1]) {
      parts.push(<strong key={m.index} style={{color:"#6a0dad",background:"rgba(106,13,173,0.12)",padding:"0 3px",borderRadius:"3px",fontFamily:"sans-serif"}}>{m[1]}</strong>);
    } else {
      parts.push(<em key={m.index} style={{color:"#1a5276",textDecoration:"underline",textDecorationStyle:"dotted",textDecorationColor:"#1a5276",fontStyle:"italic"}}>{m[2]}</em>);
    }
    last = m.index + m[0].length;
  }
  if (last < cleaned.length) parts.push(<span key="end">{cleaned.slice(last)}</span>);
  return <>{parts}</>;
}

  };

  const cancelAndReset = () => {
    if (abortRef.current) { abortRef.current.abort(); abortRef.current = null; }
    setLoading(false); setLoadingMsg(""); setPageImg(null); setPageB64(null); setError(null);
    setTimeout(() => fileRef.current?.click(), 50);
  };

  const analyse = async () => {
    if (!pageB64) { setError("Please upload a photo first."); return; }
    const nameParts = studentName.trim().split(/\s+/).filter(Boolean);
    if (nameParts.length < 2) { setError("Please enter your first name and the first initial of your surname before analysing."); return; }
    if (nameParts[nameParts.length - 1].length > 1) { setError("Only provide the first initial of your surname — e.g. Sue W"); return; }
    if (!questionNumber.trim()) { setError("Please select the question number first."); return; }
    abortRef.current = new AbortController();
    setLoading(true); setError(null);
    setLoadingMsg("Reading the question and applying CUBE...");
    try {
      const res = await fetch(PROXY, {
        method:"POST",
        headers:{"Content-Type":"application/json","X-Student-Name":encodeURIComponent(privacyName(studentName.trim()||"anonymous")),"X-Question-Number":encodeURIComponent(sanitiseInput(questionNumber))},
        signal: abortRef.current.signal,
        body: JSON.stringify({
          model: MODEL, max_tokens: 4000,
          system: [{ type:"text", text: buildSystemPrompt(SYLLABUS), cache_control:{ type:"ephemeral" } }],
          messages:[{ role:"user", content:[
            { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:pageB64 }},
            { type:"text", text:`Analyse ONLY Question ${sanitiseInput(questionNumber)} from this Business Studies image. Return JSON as specified.` }
          ]}]
        })
      });
      const data = await res.json();
      const raw = data.content.map(b=>b.text||"").join("");
      const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
      setResults(parsed);
      setPhase(2);
      setActiveTab("cube");

      // ── Log to Google Sheet ───────────────────────────────────────────────
      try {
        const kwds = parsed?.phase1_cube?.syllabusKeywords || [];
        const dirs = parsed?.phase1_cube?.directives || [];
        fetch(WEBHOOK, {
          method:"POST", redirect:"follow",
          headers:{ "Content-Type":"text/plain" },
          body: JSON.stringify({
            type:             "FULL_ROW",
            subject:          "Business Studies",
            student:          privacyName(studentName.trim() || "anonymous"),
            question:         questionNumber,
            callType:         "ANALYSE",
            model:            MODEL,
            modules:          [...new Set(kwds.map(k=>k.topicCode||k.module).filter(Boolean))].join(", ") || "—",
            directives:       dirs.map(d=>d.word).join(", ") || "—",
            syllabusKeywords: kwds.map(k=>k.word||k.topicTitle||"").filter(Boolean).join(" | ") || "—",
          })
        });
      } catch {}
    } catch(e) {
      if (e.name !== "AbortError") { console.error("Analysis error:", e); setError("Analysis failed: " + e.message); }
    }
    setLoading(false); abortRef.current = null;
  };

  const generateModelAnswer = async () => {
    if (!results) return;
    setModelLoading(true);
    const c1 = results.phase1_cube;
    const dirs2 = c1.directives?.length ? c1.directives : [];
    const kwds2 = c1.syllabusKeywords?.length ? c1.syllabusKeywords : [];
    const pk = kwds2[0] || {};
    try {
      const res = await fetch(PROXY, {
        method:"POST",
        headers:{"Content-Type":"application/json","X-Student-Name":encodeURIComponent(privacyName(studentName.trim()||"anonymous"))},
        body: JSON.stringify({
          model:"claude-haiku-4-5-20251001", max_tokens:1000,
          system:[{ type:"text", cache_control:{ type:"ephemeral" }, text:`You are an expert NSW HSC Business Studies marker and teacher. You generate Band 6 model responses aligned to official NESA performance band descriptors and Business Studies marking standards.

BAND RESPONSE GENERATOR RULES:
${JSON.stringify(BAND_RULES, null, 2)}

WRITING RULES:
- Use causal connectives naturally: SO, BECAUSE, BUT, therefore, as a result, which means, consequently
- Use precise business noun groups not vague terms
- Length: ~1 substantive sentence per mark — quality over word count
- Never pad with definitions or irrelevant background
- Always reference the specific business context in the question
- For explain/analyse: use Concept→Mechanism→Business Outcome pattern
- For evaluate/assess: include PRO, CON and explicit IS/IS NOT judgement
- Run the band6_checklist mentally before outputting`}],
          messages:[{ role:"user", content:[{type:"text", text:
            `Write a Band 6 model response for this NSW HSC Business Studies question.

Question: "${sanitiseInput(c1.questionText)}"
Directive(s): ${dirs2.map(d=>`${sanitiseInput(d.word)} — ${sanitiseInput(d.meaning)}`).join("; ")}
Syllabus topic(s): ${kwds2.map(k=>sanitiseInput(k.word||k.topicTitle)).join(", ")}
Topic: ${sanitiseInput(pk.topicCode)} — ${sanitiseInput(pk.topicTitle)}
Marks value: ${c1.marks || "unknown"}

Requirements:
- Explain the mechanism, not just the observation
- Use causal connectives naturally (SO, BECAUSE, BUT, therefore, which means)
- Use precise business terminology (name strategies, ratios, concepts explicitly)
- If evaluate/assess/justify: state a clear IS/IS NOT judgement at the end
- Reference the business context from the question
- Length: approximately one substantive sentence per mark

Return ONLY the model response text — no heading, no preamble.`
          }]}]
        })
      });
      const data = await res.json();
      setModelAnswer(data.content[0]?.text || "");
    } catch { setModelAnswer("Could not generate model answer. Please try again."); }
    setModelLoading(false);
  };

  const reset = () => {
    setPhase(0); setPageImg(null); setPageB64(null); setQuestionNumber(""); setQuestionsOnPage(null);
    setResults(null); setError(null); setModelAnswer(null); setActiveTab("cube"); setStudentName("");
  };

  const totalScore = (r) => {
    if (!r) return 0;
    const { rubric } = r;
    const causal   = rubric.causalConnectives?.applicable !== false ? (rubric.causalConnectives?.score||0) : 0;
    const modality = rubric.modality?.applicable ? (rubric.modality?.score||0) : 0;
    return causal + (rubric.complexNounGroups?.score||0) + modality + (rubric.logicalFlow?.score||0);
  };

  return (
    <div style={{minHeight:"100vh",background:bg,fontFamily:"'Georgia','Times New Roman',serif",color:"#e8eaf0"}}>

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .cube-spinner-dim { display:inline-block; width:18px; height:18px; border:3px solid rgba(90,122,154,0.2); border-top-color:#5a7a9a; border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; flex-shrink:0; }
      `}</style>

      {/* ── HEADER ── */}

          <div style={{display:"flex",alignItems:"center",gap:"16px"}}>
            <div style={{background:gold,color:"#040d18",borderRadius:"8px",padding:"6px 14px",fontWeight:900,fontSize:"18px",letterSpacing:"4px",fontFamily:"sans-serif"}}>CUBE</div>

              <div style={{fontSize:"17px",fontWeight:700,color:"#f0e6c8",fontFamily:"sans-serif"}}>HSC Marking Coach</div>

            </div>

              <div style={{fontSize:"16px",color:gold,fontWeight:700,fontFamily:"sans-serif",marginBottom:"6px"}}>Tap to upload or take a photo</div>

            {pageImg&&<button onClick={cancelAndReset} style={{width:"100%",padding:"10px",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:"10px",color:"#e8eaf0",fontSize:"13px",cursor:"pointer",marginBottom:"12px",fontFamily:"sans-serif"}}>✕ Choose a different photo</button>}

            {/* Question selector */}
            {pageImg&&<div style={{marginBottom:"16px"}}>
              <div style={{fontSize:"15px",color:"#e8eaf0",fontFamily:"sans-serif",fontWeight:700,marginBottom:"10px"}}>Which question do you want analysed?</div>
              {questionsOnPage !== null && <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>
                {questionsOnPage.map(n=>(
                  <button key={n} onClick={()=>setQuestionNumber(String(n))} style={{minWidth:"52px",height:"52px",padding:"0 14px",borderRadius:"10px",border:`2px solid ${questionNumber===String(n)?gold:"rgba(255,255,255,0.12)"}`,background:questionNumber===String(n)?"rgba(201,168,76,0.25)":"rgba(255,255,255,0.04)",color:questionNumber===String(n)?gold:"#7a9ab8",fontSize:"22px",fontWeight:900,cursor:"pointer",fontFamily:"sans-serif",transition:"all 0.15s",boxShadow:questionNumber===String(n)?`0 0 0 2px ${gold}`:"none"}}>
                    {n}
                  </button>
                ))}
                <input value={!questionsOnPage.map(String).includes(questionNumber)&&questionNumber?questionNumber:""} onChange={e=>setQuestionNumber(e.target.value)} placeholder="Other" style={{width:"72px",height:"52px",borderRadius:"10px",border:`2px solid ${!questionsOnPage.map(String).includes(questionNumber)&&questionNumber?gold:"rgba(255,255,255,0.12)"}`,background:"rgba(255,255,255,0.04)",color:"#e8eaf0",fontSize:"15px",fontWeight:700,textAlign:"center",fontFamily:"sans-serif",outline:"none"}}/>
              </div>}
            </div>}

            {error&&<div style={{background:"rgba(244,67,54,0.1)",border:"1px solid rgba(244,67,54,0.4)",borderRadius:"10px",padding:"12px 16px",color:"#ff8a80",marginBottom:"16px",fontSize:"14px",fontFamily:"sans-serif"}}>{error}</div>}

            {pageImg&&(
              questionsOnPage === null
                ? <div style={{width:"100%",padding:"18px",background:"#1a2a3a",borderRadius:"14px",fontSize:"17px",fontWeight:900,letterSpacing:"1px",fontFamily:"'Courier New',monospace",color:"#5a7a9a",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:"12px",boxSizing:"border-box"}}>
                    <span className="cube-spinner-dim"></span>Reading image for question numbers...
                  </div>
                : <button onClick={analyse} disabled={loading} style={{width:"100%",padding:"18px",background:loading?"#1a2a3a":`linear-gradient(90deg,${gold},#e8c96a)`,color:loading?"#5a7a9a":"#040d18",border:"none",borderRadius:"14px",fontSize:"17px",fontWeight:900,cursor:loading?"not-allowed":"pointer",letterSpacing:"1px",fontFamily:"sans-serif",transition:"all 0.2s"}}>
                    {loading
                      ? <span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"10px"}}><span className="cube-spinner-dim"></span>{loadingMsg}</span>
                      : "🔍  SELECT A QUESTION ABOVE  —  THEN CLICK TO ANALYSE"}
                  </button>
            )}
          </div>
        )}

        {/* ── PHASE 2: RESULTS ── */}
        {phase===2&&results&&(()=>{
          const { phase1_cube: c, phase2_plan: p, phase3_analysis: a } = results;
          const dirs = c.directives?.length ? c.directives : [];
          const kwds = c.syllabusKeywords?.length ? c.syllabusKeywords : [];
          const primaryDir = dirs.find(d=>d.isPrimary) || dirs[0] || {};
          const primaryKwd = kwds[0] || {};
          const verbType = primaryDir.verbType || "other";
          const isExplain = verbType==="explain" || dirs.some(d=>d.verbType==="explain");
          const isAssessEval = ["assess","evaluate"].includes(verbType);
          const score = totalScore(a);
          const marksKnown = c.marks !== null && c.marks !== undefined;
          const causalApplicable   = a.rubric?.causalConnectives?.applicable !== false;
          const modalityApplicable = a.rubric?.modality?.applicable === true;
          const maxScore = 10 + (causalApplicable ? 5 : 0) + (modalityApplicable ? 5 : 0);
          const band = marksKnown ? null : getBand(score, maxScore);

          return <div>
            {/* Question summary bar */}

                {dirs.map((dv,i)=>(
                  <div key={i} style={{display:"inline-block",border:"2.5px solid #c0392b",borderRadius:"50%",padding:"2px 10px",color:"#c0392b",fontWeight:900,fontSize:"13px"}}>{dv.word}</div>
                ))}
                {primaryKwd.topicCode&&<div style={{color:"#e8eaf0",fontSize:"13px",fontFamily:"sans-serif",whiteSpace:"nowrap"}}>{primaryKwd.topicCode}</div>}
                {questionNumber&&<div style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:"20px",padding:"3px 12px",color:"#c8d8e8",fontSize:"12px",fontWeight:700,fontFamily:"sans-serif"}}>Q{questionNumber}</div>}

                {!marksKnown&&band&&<div style={{background:"rgba(76,175,80,0.15)",border:"1px solid rgba(76,175,80,0.4)",borderRadius:"20px",padding:"3px 12px",color:"#81c784",fontSize:"13px",fontWeight:800,fontFamily:"sans-serif"}}>Indicative {band}</div>}
                {studentName.trim()&&<div style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:"20px",padding:"3px 12px",color:"#c8d8e8",fontSize:"12px",fontWeight:700,fontFamily:"sans-serif",display:"flex",alignItems:"center",gap:"5px"}}>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="#c9a84c" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="7" r="4"/><path d="M12 13c-5 0-8 2.5-8 4v1h16v-1c0-1.5-3-4-8-4z"/></svg>
                  {studentName.trim()}

              </div>

            {/* ═══ CUBE TAB ═══ */}
            {activeTab==="cube"&&<div>
              <SectionTitle>STEP 1 — CUBE ANALYSIS</SectionTitle>
              <SVGAnnotatedPaper text={c.questionText} directives={dirs} syllabusKeywords={kwds} constraints={c.constraints} mode="cube"/>
              {/* Legend */}
              <div style={{display:"flex",gap:"16px",flexWrap:"wrap",marginBottom:"16px",padding:"10px 14px",background:"rgba(255,255,255,0.04)",borderRadius:"10px",border:"1px solid rgba(255,255,255,0.08)"}}>
                {[{color:"#c0392b",ch:"C",desc:"Directive verb(s)"},{color:"#1a6db5",ch:"U",desc:"Syllabus keyword(s)"},{color:"#2e7d32",ch:"B",desc:"Constraints / scope words"}].map(k=>(

                ))}
              </div>
              {/* C cards */}
              {dirs.map((dv,i)=>(
                <Card key={i} bg="rgba(192,57,43,0.08)" border="rgba(192,57,43,0.3)">

                    <div style={{background:"#c0392b",color:"white",borderRadius:"50%",width:"28px",height:"28px",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:"14px",flexShrink:0}}>C</div>

                      {["assess","evaluate"].includes(dv.verbType)&&<div style={{marginTop:"8px",display:"flex",gap:"8px",flexWrap:"wrap"}}>

              {c.constraints?.length>0&&<Card bg="rgba(46,125,50,0.08)" border="rgba(46,125,50,0.3)">
                <div style={{display:"flex",gap:"12px",alignItems:"flex-start"}}>
                  <div style={{background:"#2e7d32",color:"white",borderRadius:"50%",width:"28px",height:"28px",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:"14px",flexShrink:0}}>B</div>
                  <div style={{width:"100%"}}>
                    <div style={{fontWeight:700,color:"#a5d6a7",fontSize:"15px",marginBottom:"8px"}}>Constraints &amp; Scope Words:</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>
                      {c.constraints.map((ct,i)=><div key={i} style={{background:"rgba(46,125,50,0.12)",border:"2px solid #2e7d32",borderRadius:"6px",padding:"4px 12px"}}>
                        <div style={{color:"#a5d6a7",fontWeight:700,fontSize:"14px"}}>{ct.text}</div>
                        <div style={{color:"#81c784",fontSize:"11px",fontFamily:"sans-serif"}}>{ct.type?.replace(/_/g," ")}</div>
                      </div>)}
                    </div>
                    {c.evidenceRequired&&<div style={{marginTop:"10px",background:"rgba(201,168,76,0.1)",border:"1px solid rgba(201,168,76,0.3)",borderRadius:"6px",padding:"6px 12px",fontSize:"14px",color:gold,fontFamily:"sans-serif"}}>⚠️ Evidence required: {c.evidenceType}</div>}
                  </div>
                </div>
              </Card>}
            </div>}

            {/* ═══ PLAN TAB ═══ */}
            {activeTab==="plan"&&<div>
              <SectionTitle>STEP 2 — ANSWER PLANNING</SectionTitle>
              <div style={{fontSize:"14px",color:"#e8eaf0",fontFamily:"sans-serif",marginBottom:"12px",lineHeight:"1.6"}}>Planning notes are written above each key word — annotate before you write.</div>
              <SVGAnnotatedPaper text={c.questionText} directives={dirs} syllabusKeywords={kwds} constraints={c.constraints} planningArrows={p.planningArrows} mode="plan"/>
              {p.summary&&<Card bg="rgba(201,168,76,0.08)" border="rgba(201,168,76,0.3)">
                <div style={{fontSize:"15px",color:"#f0e6c8",lineHeight:"1.6"}}><strong style={{color:gold}}>In short: </strong>{p.summary}</div>
              </Card>}
              {p.writingScaffold&&<Card bg="rgba(33,150,243,0.06)" border="rgba(33,150,243,0.25)">
                <SectionTitle color="#ffffff">WRITING SCAFFOLD</SectionTitle>
                {["step1","step2","step3","step4"].filter(k=>p.writingScaffold[k]).map((k,i)=>(
                  <div key={k} style={{display:"flex",gap:"12px",marginBottom:"12px",alignItems:"flex-start"}}>
                    <div style={{background:"#1565c0",color:"white",borderRadius:"50%",width:"26px",height:"26px",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:"13px",flexShrink:0,marginTop:"2px",fontFamily:"sans-serif"}}>{i+1}</div>
                    <div style={{color:"#e8eaf0",fontSize:"15px",lineHeight:"1.6"}}>{p.writingScaffold[k]}</div>
                  </div>
                ))}
              </Card>}
            </div>}

            {/* ═══ SCRIPT TAB ═══ */}
            {activeTab==="script"&&<div>
              <SectionTitle>STEP 3 — YOUR RESPONSE (FORMATTED)</SectionTitle>
              <div style={{background:"rgba(255,255,255,0.04)",borderRadius:"12px",padding:"6px 12px",marginBottom:"12px",border:"1px solid rgba(255,255,255,0.08)",display:"flex",gap:"16px",flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:"13px",color:"#e8eaf0",fontFamily:"sans-serif"}}><strong style={{color:"#6a0dad",background:"rgba(106,13,173,0.12)",padding:"0 4px",borderRadius:"3px",fontFamily:"sans-serif"}}>bold</strong> = causal connective</span>
                <span style={{fontSize:"13px",color:"#e8eaf0",fontFamily:"sans-serif"}}><em style={{color:"#1a5276",textDecoration:"underline",textDecorationStyle:"dotted"}}>italic underline</em> = business noun group</span>
                <span style={{fontSize:"13px",fontFamily:"sans-serif",color:"#e8eaf0"}}><span style={{background:"#ff6d00",color:"white",borderRadius:"4px",padding:"1px 6px",fontWeight:900,fontSize:"11px"}}>?</span> = illegible word</span>
              </div>
              <PaperCard subtitle="STUDENT RESPONSE — VERBATIM">
                <div style={{fontSize:"16px",lineHeight:"1.9",color:"#1a1a2e",fontFamily:"'Georgia',serif"}}>
                  <FormattedResponse text={enrichFormattedResponse(a.formattedResponse, a.studentResponseText, a.detectedNounGroups, CONNECTIVES)}/>
                </div>
              </PaperCard>
              {(()=>{const t=enrichFormattedResponse(a.formattedResponse, a.studentResponseText, a.detectedNounGroups, CONNECTIVES)||""; return (normaliseIllegible(t).includes("[?]"))&&pageB64;})()&&<div style={{marginBottom:"14px"}}>
                <div style={{fontSize:"11px",color:"#ff9800",fontWeight:800,letterSpacing:"1px",marginBottom:"8px",fontFamily:"sans-serif"}}>📷 YOUR ORIGINAL PHOTO — Check the <span style={{background:"#ff6d00",color:"white",borderRadius:"3px",padding:"0 5px"}}>?</span> words</div>
                <img src={`data:image/jpeg;base64,${pageB64}`} style={{maxWidth:"100%",borderRadius:"10px",border:"2px solid rgba(255,152,0,0.4)",boxShadow:"0 4px 16px rgba(0,0,0,0.4)"}} alt="Your worksheet"/>
              </div>}
              <Card bg="rgba(255,255,255,0.04)" border="rgba(255,255,255,0.1)">
                <SectionTitle>RESPONSE STRUCTURE CHECK</SectionTitle>
                <div style={{fontSize:"15px",color:"#e8eaf0",fontFamily:"sans-serif",marginBottom:"10px",lineHeight:"1.5"}}>{a.responseStructure?.structureComment}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
                  {isExplain&&[
                    [a.responseStructure?.hasCause,"Cause identified"],
                    [a.responseStructure?.hasCausalConnective,"Causal connective used"],
                    [a.responseStructure?.hasEffect,"Effect/business outcome explained"],
                  ].map(([ok,label],i)=><div key={i} style={{display:"flex",gap:"8px",alignItems:"center",fontSize:"13px",fontFamily:"sans-serif"}}><Tick ok={ok}/><span style={{color:"#c8d8e8"}}>{label}</span></div>)}
                  {isAssessEval&&[
                    [a.responseStructure?.hasArgument1,"PRO / advantage stated"],
                    [a.responseStructure?.hasArgument2OrCounterpoint,"CON / limitation stated"],
                    [a.responseStructure?.hasFinalJudgement,"IS / IS NOT judgement"],
                  ].map(([ok,label],i)=><div key={i} style={{display:"flex",gap:"8px",alignItems:"center",fontSize:"13px",fontFamily:"sans-serif"}}><Tick ok={ok}/><span style={{color:"#c8d8e8"}}>{label}</span></div>)}
                  {verbType==="justify"&&[
                    [a.responseStructure?.hasArgument1,"Strategy named"],
                    [a.responseStructure?.hasCausalConnective,"Rationale linked to business"],
                    [a.responseStructure?.hasFinalJudgement,"Business outcome stated"],
                  ].map(([ok,label],i)=><div key={i} style={{display:"flex",gap:"8px",alignItems:"center",fontSize:"13px",fontFamily:"sans-serif"}}><Tick ok={ok}/><span style={{color:"#c8d8e8"}}>{label}</span></div>)}
                </div>
              </Card>
            </div>}

            {/* ═══ RUBRIC TAB ═══ */}
            {activeTab==="rubric"&&<div>
              <SectionTitle>STEP 4 — RUBRIC TABLE</SectionTitle>
              <Card bg="rgba(255,255,255,0.03)" border="rgba(255,255,255,0.08)" style={{padding:0,overflow:"hidden"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead>
                    <tr style={{background:"rgba(201,168,76,0.12)"}}>
                      <th style={{padding:"12px 14px",textAlign:"left",color:gold,fontSize:"12px",fontFamily:"sans-serif",fontWeight:800,letterSpacing:"1px"}}>CRITERION</th>
                      <th style={{padding:"12px 14px",textAlign:"center",color:gold,fontSize:"12px",fontFamily:"sans-serif",fontWeight:800,letterSpacing:"1px",width:"64px"}}>SCORE</th>
                      <th style={{padding:"12px 14px",textAlign:"left",color:gold,fontSize:"12px",fontFamily:"sans-serif",fontWeight:800,letterSpacing:"1px"}}>EVIDENCE &amp; COMMENT</th>
                    </tr>
                  </thead>
                  <tbody>
                    <RubricRow label="Causal Connectives" data={a.rubric?.causalConnectives} applicable={a.rubric?.causalConnectives?.applicable !== false}/>
                    <RubricRow label="Business Noun Groups" data={a.rubric?.complexNounGroups} applicable={true}/>
                    <RubricRow label="Modality / Judgement" data={a.rubric?.modality} applicable={a.rubric?.modality?.applicable === true}/>
                    <RubricRow label="Logical Flow" data={a.rubric?.logicalFlow} applicable={true}/>
                    <tr style={{background:"rgba(201,168,76,0.06)"}}>
                      <td style={{padding:"12px 14px",color:gold,fontWeight:800,fontFamily:"sans-serif",fontSize:"13px"}}>TOTAL</td>
                      <td style={{padding:"12px 14px",textAlign:"center",color:gold,fontWeight:900,fontSize:"18px",fontFamily:"sans-serif"}}>{score}<span style={{fontSize:"12px",color:"#888",fontWeight:400,fontFamily:"sans-serif"}}>/{maxScore}</span></td>
                      <td style={{padding:"12px 14px",fontFamily:"sans-serif",fontSize:"13px"}}>
                        {!marksKnown&&band&&<span style={{background:"rgba(76,175,80,0.2)",border:"1px solid rgba(76,175,80,0.5)",borderRadius:"8px",padding:"3px 12px",color:"#81c784",fontWeight:800}}>Indicative {band}</span>}
                        {marksKnown&&<span style={{color:"#e8eaf0",fontSize:"12px"}}>Mark value provided — band not calculated</span>}
                      </td>
                    </tr>
                  </tbody>
                </table>
              </Card>
              {/* Detected features */}
              <div style={{display:"grid",gridTemplateColumns:`${causalApplicable?"1fr ":""}1fr`,gap:"12px",marginTop:"4px"}}>
                {causalApplicable&&<Card bg="rgba(123,31,162,0.08)" border="rgba(123,31,162,0.3)">
                  <SectionTitle color="#ce93d8">CONNECTIVES FOUND</SectionTitle>
                  {a.detectedConnectives?.length>0 ? <>
                    <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"8px"}}>
                      {a.detectedConnectives.map((c,i)=>{
                        const isPref = CONNECTIVES.preferred.includes(c.toLowerCase());
                        return <span key={i} style={{display:"inline-block",background:isPref?"rgba(123,31,162,0.3)":"rgba(46,125,50,0.2)",border:`1px solid ${isPref?"rgba(206,147,216,0.5)":"rgba(129,199,132,0.5)"}`,borderRadius:"5px",padding:"3px 10px",fontSize:"13px",fontWeight:700,color:isPref?"#ce93d8":"#81c784",fontFamily:"sans-serif"}}>{c}</span>;
                      })}
                    </div>
                    <div style={{fontSize:"11px",color:"#888",fontFamily:"sans-serif"}}><span style={{color:"#ce93d8"}}>■</span> SO/BECAUSE/BUT &nbsp;<span style={{color:"#81c784"}}>■</span> accepted alternative — both valid ✓</div>
                  </> : <div style={{color:"#e8eaf0",fontSize:"13px",fontFamily:"sans-serif",fontStyle:"italic"}}>None detected</div>}
                </Card>}
                <Card bg="rgba(21,101,192,0.08)" border="rgba(21,101,192,0.3)">
                  <SectionTitle color="#64b5f6">BUSINESS NOUN GROUPS</SectionTitle>
                  {a.detectedNounGroups?.length>0 ? a.detectedNounGroups.map((ng,i)=><div key={i} style={{fontSize:"15px",color:"#e8eaf0",fontStyle:"italic",marginBottom:"3px"}}>"{ng}"</div>)
                  :<div style={{color:"#e8eaf0",fontSize:"13px",fontFamily:"sans-serif",fontStyle:"italic"}}>None detected</div>}
                </Card>
              </div>
            </div>}

            {/* ═══ FEEDBACK TAB ═══ */}
            {activeTab==="feedback"&&<div>
              <SectionTitle>STEPS 5–8 — MEDALS, MISSION &amp; FEEDBACK</SectionTitle>
              {/* Medals */}
              {a.medals?.medal1&&<Card bg="rgba(255,215,0,0.06)" border="rgba(255,215,0,0.3)">
                <div style={{display:"flex",gap:"12px",alignItems:"flex-start"}}>
                  <div style={{fontSize:"32px"}}>🥇</div>
                  <div>
                    <div style={{fontWeight:800,color:"#ffd700",fontSize:"15px",marginBottom:"4px",fontFamily:"sans-serif"}}>Medal 1 — {a.medals.medal1.category}</div>
                    <div style={{color:"#f0e6c8",fontSize:"14px",lineHeight:"1.6",marginBottom:"8px"}}>{a.medals.medal1.explanation}</div>
                    <div style={{background:"rgba(255,215,0,0.08)",border:"1px solid rgba(255,215,0,0.25)",borderRadius:"8px",padding:"8px 12px",color:"#f5d67a",fontSize:"13px",fontStyle:"italic"}}>"{a.medals.medal1.quote}"</div>
                  </div>
                </div>
              </Card>}
              {a.medals?.medal2&&<Card bg="rgba(192,192,192,0.06)" border="rgba(192,192,192,0.25)">
                <div style={{display:"flex",gap:"12px",alignItems:"flex-start"}}>
                  <div style={{fontSize:"32px"}}>🥈</div>
                  <div>
                    <div style={{fontWeight:800,color:"#c0c0c0",fontSize:"15px",marginBottom:"4px",fontFamily:"sans-serif"}}>Medal 2 — {a.medals.medal2.category}</div>
                    <div style={{color:"#e0e0e0",fontSize:"14px",lineHeight:"1.6",marginBottom:"8px"}}>{a.medals.medal2.explanation}</div>
                    <div style={{background:"rgba(192,192,192,0.08)",border:"1px solid rgba(192,192,192,0.2)",borderRadius:"8px",padding:"8px 12px",color:"#d0d0d0",fontSize:"13px",fontStyle:"italic"}}>"{a.medals.medal2.quote}"</div>
                  </div>
                </div>
              </Card>}
              {/* Mission */}
              {a.mission&&<Card bg="rgba(244,67,54,0.06)" border="rgba(244,67,54,0.3)">
                <div style={{display:"flex",gap:"12px",alignItems:"flex-start"}}>
                  <div style={{fontSize:"32px"}}>🎯</div>
                  <div style={{width:"100%"}}>
                    <div style={{fontWeight:800,color:"#ff8a80",fontSize:"15px",marginBottom:"4px",fontFamily:"sans-serif"}}>Your Mission — {a.mission.targetCategory}</div>
                    <div style={{color:"#ffcdd2",fontSize:"14px",lineHeight:"1.6",marginBottom:"10px"}}>{a.mission.weakness}</div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
                      <div style={{background:"rgba(244,67,54,0.1)",borderRadius:"8px",padding:"10px 12px",border:"1px solid rgba(244,67,54,0.25)"}}>
                        <div style={{fontSize:"10px",color:"#ff8a80",fontWeight:700,letterSpacing:"1px",marginBottom:"6px",fontFamily:"sans-serif"}}>ORIGINAL</div>
                        <div style={{fontSize:"13px",color:"#ffcdd2",fontStyle:"italic"}}>"{a.mission.originalPhrase}"</div>
                      </div>
                      <div style={{background:"rgba(76,175,80,0.08)",borderRadius:"8px",padding:"10px 12px",border:"1px solid rgba(76,175,80,0.25)"}}>
                        <div style={{fontSize:"10px",color:"#81c784",fontWeight:700,letterSpacing:"1px",marginBottom:"6px",fontFamily:"sans-serif"}}>IMPROVED</div>
                        <div style={{fontSize:"13px",color:"#c8e6c9",fontStyle:"italic"}}>"{a.mission.improvedVersion}"</div>
                      </div>
                    </div>
                  </div>
                </div>
              </Card>}
              {/* Special checks */}
              {a.specialCheck?.type!=="none"&&<Card bg={isExplain?"rgba(123,31,162,0.1)":"rgba(230,81,0,0.1)"} border={isExplain?"rgba(123,31,162,0.35)":"rgba(230,81,0,0.35)"}>
                <SectionTitle color={isExplain?"#ce93d8":"#ffab91"}>{isExplain?"⚠️ EXPLAIN — CAUSAL CONNECTIVES":"⚠️ EVALUATE/ASSESS — ARGUMENT STRUCTURE"}</SectionTitle>
                {isExplain&&a.specialCheck?.explainCheck&&(()=>{
                  const ec = a.specialCheck.explainCheck;
                  const hasPreferred = ec.hasSO || ec.hasBECAUSE || ec.hasBUT;
                  const hasAccepted  = ec.acceptedConnectivesFound?.length > 0;
                  const hasAny = hasPreferred || hasAccepted;
                  const allFound = [...(ec.hasSO?["so"]:[]),...(ec.hasBECAUSE?["because"]:[]),...(ec.hasBUT?["but"]:[]),...(ec.acceptedConnectivesFound||[])];
                  return <>
                    <div style={{display:"flex",gap:"10px",alignItems:"center",marginBottom:"10px",fontSize:"13px",fontFamily:"sans-serif"}}><Tick ok={ec.causeEffectLinked}/><span style={{color:"#e8eaf0"}}>Cause linked to effect</span></div>
                    {hasAny && <div style={{background:"rgba(76,175,80,0.1)",border:"1px solid rgba(76,175,80,0.35)",borderRadius:"8px",padding:"10px 14px",marginBottom:"8px"}}>
                      <div style={{fontSize:"11px",color:"#81c784",fontWeight:800,letterSpacing:"1px",marginBottom:"8px",fontFamily:"sans-serif"}}>✅ CAUSAL CONNECTIVES USED</div>
                      <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"8px"}}>
                        {allFound.map((c,i)=>{
                          const isPref = CONNECTIVES.preferred.includes(c.toLowerCase());
                          return <span key={i} style={{background:isPref?"rgba(123,31,162,0.25)":"rgba(201,168,76,0.2)",border:`1px solid ${isPref?"rgba(206,147,216,0.5)":"rgba(201,168,76,0.4)"}`,borderRadius:"5px",padding:"3px 10px",fontSize:"13px",fontWeight:700,color:isPref?"#ce93d8":"#f0d080",fontFamily:"sans-serif"}}>{c}</span>;
                        })}
                      </div>
                      {!hasPreferred&&<div style={{fontSize:"12px",color:"#c9a84c",fontFamily:"sans-serif",fontStyle:"italic"}}>Good use of causal connectives — also try SO / BECAUSE / BUT for maximum HSC impact.</div>}
                    </div>}
                    {!hasAny && <div style={{background:"rgba(244,67,54,0.08)",border:"1px solid rgba(244,67,54,0.3)",borderRadius:"8px",padding:"10px 14px",marginBottom:"8px"}}>
                      <div style={{fontSize:"13px",color:"#ff8a80",fontFamily:"sans-serif",fontWeight:600}}>❌ No causal connectives found</div>
                      <div style={{fontSize:"12px",color:"#e8eaf0",fontFamily:"sans-serif",marginTop:"4px"}}>Try: <strong style={{color:"#ce93d8"}}>SO</strong>, <strong style={{color:"#ce93d8"}}>BECAUSE</strong>, <strong style={{color:"#ce93d8"}}>BUT</strong> — or <em>therefore, thus, as a result, which means, consequently</em></div>
                    </div>}
                    <div style={{marginTop:"6px",color:"#d1c4e9",fontSize:"13px",fontFamily:"sans-serif",lineHeight:"1.6"}}>{ec.comment}</div>
                  </>;
                })()}
                {isAssessEval&&a.specialCheck?.assessEvalCheck&&<>
                  {[[a.specialCheck.assessEvalCheck.hasPRO,"PRO / advantage",a.specialCheck.assessEvalCheck.proText],[a.specialCheck.assessEvalCheck.hasCON,"CON / limitation",a.specialCheck.assessEvalCheck.conText],[a.specialCheck.assessEvalCheck.hasJudgement,"IS or IS NOT judgement",a.specialCheck.assessEvalCheck.judgementText],[a.specialCheck.assessEvalCheck.judgementLinked,"Judgement linked to PRO/CON",null]].map(([ok,label,quote],i)=><div key={i} style={{marginBottom:"8px"}}>
                    <div style={{display:"flex",gap:"10px",alignItems:"center",fontSize:"13px",fontFamily:"sans-serif"}}><Tick ok={ok}/><span style={{color:"#e8eaf0",fontWeight:600}}>{label}</span></div>
                    {quote&&<div style={{marginLeft:"26px",color:"#ffccbc",fontSize:"15px",fontStyle:"italic",fontFamily:"sans-serif"}}>"{quote}"</div>}
                  </div>)}
                  <div style={{marginTop:"8px",color:"#ffccbc",fontSize:"13px",fontFamily:"sans-serif",lineHeight:"1.6"}}>{a.specialCheck.assessEvalCheck.comment}</div>
                </>}
              </Card>}
              {/* Model answer */}
              {a.specialCheck?.modelSentenceStarter&&<Card bg="rgba(201,168,76,0.06)" border="rgba(201,168,76,0.3)">
                <SectionTitle color={gold}>💡 HOW TO STRUCTURE YOUR ANSWER</SectionTitle>
                <div style={{fontSize:"13px",color:"#c8d8e8",fontFamily:"sans-serif",marginBottom:"10px",lineHeight:"1.5"}}>
                  This shows the <strong style={{color:"#f0d080"}}>sentence pattern</strong> a top student would use — the key words in <span style={{background:"#7b1fa2",color:"white",borderRadius:"3px",padding:"0 5px",fontSize:"11px",fontWeight:900}}>PURPLE</span> are the connectives that link your ideas.
                </div>
                <div style={{background:"rgba(255,255,255,0.93)",borderRadius:"12px",padding:"14px 16px",border:"1px solid rgba(201,168,76,0.35)",marginBottom:"6px"}}>
                  <div style={{fontSize:"14px",color:"#222",fontFamily:"'Georgia',serif",lineHeight:"1.9"}}>
                    {a.specialCheck.modelSentenceStarter.split(/\b(SO|BECAUSE|BUT|IS NOT|IS|THEREFORE|AS A RESULT|WHICH MEANS)\b/).map((part,i)=>
                      ["SO","BECAUSE","BUT","IS NOT","IS","THEREFORE","AS A RESULT","WHICH MEANS"].includes(part)
                        ?<span key={i} style={{background:"#7b1fa2",color:"white",borderRadius:"4px",padding:"1px 7px",fontWeight:900,fontFamily:"sans-serif",fontSize:"12px",margin:"0 2px"}}>{part}</span>
                        :<span key={i}>{part}</span>
                    )}
                  </div>
                  <div style={{marginTop:"8px",fontSize:"11px",color:"#888",fontFamily:"sans-serif",borderTop:"1px solid #eee",paddingTop:"6px"}}>✏️ This is a <em>pattern</em>, not an answer — write your own version using your business knowledge</div>
                </div>
                {!modelAnswer&&<>
                  <div style={{marginTop:"16px",marginBottom:"6px",fontSize:"13px",color:"#c8d8e8",fontFamily:"sans-serif",lineHeight:"1.5"}}>
                    Want to see a <strong style={{color:"#f0d080"}}>complete Band 6 example answer</strong>? Use it to check depth and detail — not to copy.
                  </div>
                  <button onClick={generateModelAnswer} disabled={modelLoading} style={{width:"100%",padding:"12px",background:modelLoading?"#1a2a3a":`linear-gradient(90deg,${gold},#e8c96a)`,color:modelLoading?"#5a7a9a":"#040d18",border:"none",borderRadius:"10px",fontSize:"14px",fontWeight:800,cursor:modelLoading?"not-allowed":"pointer",fontFamily:"sans-serif"}}>
                    {modelLoading ? <span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:"10px"}}><span className="cube-spinner"></span>Generating...</span> : "✨ Show me a Band 6 example answer"}
                  </button>
                </>}
                {modelAnswer&&<>
                  <div style={{marginTop:"14px",marginBottom:"8px",fontSize:"11px",color:"#c9a84c",fontWeight:800,letterSpacing:"1px",fontFamily:"sans-serif"}}>✨ BAND 6 EXAMPLE ANSWER</div>
                  <PaperCard subtitle="">
                    <div style={{fontSize:"15px",lineHeight:"1.9",color:"#1a1a2e",fontFamily:"'Georgia',serif"}}>{modelAnswer}</div>
                  </PaperCard>
                  <div style={{fontSize:"12px",color:"#9ab",fontFamily:"sans-serif",fontStyle:"italic",marginTop:"6px"}}>AI-generated example — use it to understand Band 6 depth and structure, not to copy.</div>
                </>}
              </Card>}
            </div>}

          </div>;
        })()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
